# vCluster Platform serves its UI, API, Kubernetes proxy to tenant clusters,
# Tailscale coordinator, and DERP on one hostname, so a single catch-all route
# to the loft Service covers all of it. TLS terminates at Envoy, so the route
# targets the Service's plain HTTP port.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vcluster-platform-redirect
  namespace: vcluster-platform
spec:
  parentRefs:
    - name: platform-edge
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - platform.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vcluster-platform
  namespace: vcluster-platform
spec:
  parentRefs:
    - name: platform-edge
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - platform.example.com
  rules:
    - backendRefs:
        - name: loft
          port: 80
      timeouts:
        # Envoy's default route timeout is 15s. Watches, log follows, and the
        # Tailscale map poll are long-lived requests.
        request: 0s
